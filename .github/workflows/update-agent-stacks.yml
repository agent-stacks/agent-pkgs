name: "Update agent-stacks"

# Raised by the CI workflow in agent-stacks/agent-stacks-cli after it
# uploads the binaries for a commit. Can also be run by hand from the
# Actions tab against any commit whose binaries are already uploaded.
on:
  workflow_dispatch:
    inputs:
      rev:
        description: "agent-stacks commit the binaries were built from (full sha)"
        type: string
        required: true
      version:
        description: "What VERSION reads in that commit, e.g. 0.8.0"
        type: string
        required: true
      describe:
        description: >-
          git describe --tags --always in that commit, e.g. 0.9.0-3-gabc1234.
          Becomes the package version. Optional: without it the version falls
          back to <version>-unstable-<today>, which cannot tell two commits
          from the same day apart.
        type: string
        required: false

permissions:
  contents: write

# The workflow ends by moving main. Two runs doing that at once would leave
# one of them rejected halfway through, so they are queued. Never cancelled:
# a cancelled run can have already pushed the staging branch.
concurrency:
  group: update-agent-stacks
  cancel-in-progress: false

env:
  NIX_CONFIG: |
    experimental-features = nix-command flakes
    # The flake offers cache.numtide.com as a substituter. Without this,
    # every nix command here opens with two warnings about ignoring it,
    # because the runner's user is not a trusted user.
    accept-flake-config = true
  # Where prepare stages the commit for the verify jobs to build. It is not
  # a pull request branch; land fast-forwards main onto it and deletes it.
  STAGING_BRANCH: update-agent-stacks

jobs:
  prepare:
    name: "Prefetch the binaries and stage the commit"
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.stage.outputs.changed }}
      # The commit verify builds and land pushes, named exactly
      # rather than through the branch it also sits on.
      sha: ${{ steps.stage.outputs.sha }}
    steps:
      # The pushes below authenticate as a GitHub App, not as the
      # workflow's own GITHUB_TOKEN.
      #
      # main carries two rulesets. main-block refuses a deletion or a
      # non-fast-forward, which none of this does. main-require wants a
      # pull request and a passing Summary check, and a ruleset's bypass
      # list can name only roles, teams, deploy keys and installed apps
      # — the built-in GitHub Actions app is not one of them, so
      # GITHUB_TOKEN cannot be exempted and its push is refused with
      # "GH006: Protected branch update failed". The app is in that
      # bypass list, so the token minted here lands.
      #
      # The app is agent-stacks-updater, installed on the repositories
      # whose packages it updates, and its credentials are organization
      # secrets rather than this repository's, so one app and one key
      # serve all of them. A token is scoped to the repository it is
      # minted in; reaching another one would need owner/repositories
      # passed here as well.
      #
      # No fallback to GITHUB_TOKEN. There was one until 2026-10-13,
      # with continue-on-error here, so that the workflows kept
      # working before the app existed. What it did once the app was
      # the only way main moves: a private key stored with its
      # newlines collapsed failed this step, every job reported
      # success, and three runs built for an hour each before land was
      # refused with GH013 — the one symptom that does not name the
      # cause. The token is a precondition now, and a run without it
      # stops here saying so.
      - name: "Mint a token for the app that may push main"
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.MANAGED_AGENT_STACKS_UPDATER_APP_ID }}
          private-key: ${{ secrets.MANAGED_AGENT_STACKS_UPDATER_PRIVATE_KEY }}

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: "Install flox"
        uses: flox/install-flox-action@3b80351ae97bbe063f264dc88fbd505507054963 # v2.5.3

      - name: "Configure nix"
        uses: flox/configure-nix-action@28a4eb7f63bf54c91670b4a698f0a9ebfb95384f # main

      - name: "Point nix at a CA bundle"
        uses: ./.github/actions/nix-ssl-cert-file

      - name: "Trust the runner's user"
        uses: ./.github/actions/trust-nix-user

      # A short or malformed rev would build a URL that 404s several steps
      # later, with nothing to say which input was wrong.
      - name: "Check the inputs"
        env:
          REV: ${{ inputs.rev }}
          VERSION: ${{ inputs.version }}
        run: |
          case "$REV" in
            *[!0-9a-f]* | "") echo "rev '$REV' is not a lowercase hex sha" >&2; exit 1 ;;
          esac
          if [ "${#REV}" -ne 40 ]; then
            echo "rev '$REV' is ${#REV} characters; the full 40 are required" >&2
            exit 1
          fi
          if [ -z "$VERSION" ]; then
            echo "version is empty" >&2
            exit 1
          fi

      # Nothing to do when source.json already names this commit: a rerun of
      # the same dispatch, or a dispatch racing one that already landed.
      - name: "Stop if this commit is already the one packaged"
        id: current
        env:
          REV: ${{ inputs.rev }}
        run: |
          have="$(jq -r .rev pkgs/agent-stacks/source.json)"
          if [ "$have" = "$REV" ]; then
            echo "pkgs/agent-stacks already points at $REV"
            echo "same=true" >> "$GITHUB_OUTPUT"
          else
            echo "same=false" >> "$GITHUB_OUTPUT"
          fi

      # One prefetch per system. Each also proves the object is really there:
      # the upload that raised this dispatch is the only thing that puts it
      # in the bucket, and a missing one fails here rather than in a build.
      - name: "Prefetch the uploaded binaries"
        if: ${{ steps.current.outputs.same == 'false' }}
        id: prefetch
        env:
          REV: ${{ inputs.rev }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          short="${REV:0:7}"
          hashes="{}"
          for system in x86_64-linux aarch64-linux aarch64-darwin; do
            url="https://downloads.agent-stacks.org/agent-stacks/by-commit/$REV/agent-stacks-$VERSION-$short-$system"
            echo "prefetching $system"
            hash="$(nix store prefetch-file --json "$url" | jq -r .hash)"
            hashes="$(jq --arg s "$system" --arg h "$hash" '.[$s] = $h' <<<"$hashes")"
          done
          {
            echo "hashes<<EOF"
            echo "$hashes"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # The date is the day this ran, not the commit's own date: the dispatch
      # arrives within minutes of the upload, and reading the commit date
      # would mean handing this workflow a token for a private repository.
      - name: "Rewrite pkgs/agent-stacks/source.json"
        if: ${{ steps.current.outputs.same == 'false' }}
        env:
          REV: ${{ inputs.rev }}
          VERSION: ${{ inputs.version }}
          DESCRIBE: ${{ inputs.describe }}
          HASHES: ${{ steps.prefetch.outputs.hashes }}
        run: |
          set -euo pipefail
          # version is what the package is published as; baseVersion
          # stays what the binary reports and what the uploaded object's
          # name embeds, which are not the same thing. An empty describe
          # writes no version field, and the expression falls back.
          jq -n \
            --arg baseVersion "$VERSION" \
            --arg version "$DESCRIBE" \
            --arg rev "$REV" \
            --arg date "$(date -u +%Y-%m-%d)" \
            --argjson hashes "$HASHES" \
            '{ $baseVersion, $rev, $date, $hashes }
             + (if $version == "" then {} else { $version } end)' \
            > pkgs/agent-stacks/source.json

      - name: "Stage the commit"
        if: ${{ steps.current.outputs.same == 'false' }}
        id: stage
        env:
          REV: ${{ inputs.rev }}
          VERSION: ${{ inputs.version }}
          # gh looks up the bot user id for the commit identity below.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- pkgs/agent-stacks/source.json; then
            echo "source.json is unchanged"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The app's bot user, so a landed commit names what pushed
          # it. The step above fails the job when no token was minted,
          # so the slug is always set here.
          slug="${{ steps.app-token.outputs.app-slug }}"
          git config user.name "${slug}[bot]"
          # The numeric form links the commit to the bot account. A
          # lookup that is refused leaves the plain form, which is
          # still a valid noreply address.
          id="$(gh api "/users/${slug}%5Bbot%5D" --jq .id 2>/dev/null || true)"
          git config user.email "${id:+$id+}${slug}[bot]@users.noreply.github.com"
          git commit -q -m "chore(agent-stacks): ${VERSION} at ${REV:0:7}" \
            -m "Binaries uploaded by agent-stacks/agent-stacks-cli for commit ${REV}." \
            -- pkgs/agent-stacks/source.json
          git push --force origin "HEAD:refs/heads/$STAGING_BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Every system is built before main moves. A hash can be right and the
  # binary still wrong: it is the installCheck, which runs the binary and
  # compares what it reports to the version being packaged, that this is
  # really here for.
  verify:
    name: "Build ${{ matrix.system }}"
    needs: prepare
    if: ${{ needs.prepare.outputs.changed == 'true' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      # One runner per system, so each binary is checked on the machine that
      # can actually execute it. aarch64-linux runners are free on public
      # repositories, which this one is.
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: aarch64-darwin
            runner: macos-26
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: "Install flox"
        uses: flox/install-flox-action@3b80351ae97bbe063f264dc88fbd505507054963 # v2.5.3

      - name: "Configure nix"
        uses: flox/configure-nix-action@28a4eb7f63bf54c91670b4a698f0a9ebfb95384f # main

      - name: "Point nix at a CA bundle"
        uses: ./.github/actions/nix-ssl-cert-file

      - name: "Trust the runner's user"
        uses: ./.github/actions/trust-nix-user

      - name: "Build agent-stacks"
        run: nix build -L ".#packages.${{ matrix.system }}.agent-stacks"

  land:
    name: "Move main onto the staged commit"
    needs: [prepare, verify]
    # Only from main. prepare stages on whatever ref was dispatched,
    # and the token below bypasses the pull request main requires, so
    # landing a dispatch from another branch would put that branch's
    # unreviewed commits on main.
    if: >-
      ${{ needs.prepare.outputs.changed == 'true'
      && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    steps:
      # The pushes below authenticate as a GitHub App, not as the
      # workflow's own GITHUB_TOKEN.
      #
      # main carries two rulesets. main-block refuses a deletion or a
      # non-fast-forward, which none of this does. main-require wants a
      # pull request and a passing Summary check, and a ruleset's bypass
      # list can name only roles, teams, deploy keys and installed apps
      # — the built-in GitHub Actions app is not one of them, so
      # GITHUB_TOKEN cannot be exempted and its push is refused with
      # "GH006: Protected branch update failed". The app is in that
      # bypass list, so the token minted here lands.
      #
      # The app is agent-stacks-updater, installed on the repositories
      # whose packages it updates, and its credentials are organization
      # secrets rather than this repository's, so one app and one key
      # serve all of them. A token is scoped to the repository it is
      # minted in; reaching another one would need owner/repositories
      # passed here as well.
      #
      # No fallback to GITHUB_TOKEN. There was one until 2026-10-13,
      # with continue-on-error here, so that the workflows kept
      # working before the app existed. What it did once the app was
      # the only way main moves: a private key stored with its
      # newlines collapsed failed this step, every job reported
      # success, and three runs built for an hour each before land was
      # refused with GH013 — the one symptom that does not name the
      # cause. The token is a precondition now, and a run without it
      # stops here saying so.
      - name: "Mint a token for the app that may push main"
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.MANAGED_AGENT_STACKS_UPDATER_APP_ID }}
          private-key: ${{ secrets.MANAGED_AGENT_STACKS_UPDATER_PRIVATE_KEY }}

      # The commit verify checked, named by SHA rather than through
      # the staging branch, which can have moved since. If main has
      # moved too, the loop below rebases it, and what lands is the
      # verified change replayed onto the newer main rather than the
      # exact tree verify saw: a conflict stops it, nothing re-checks it.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0

      # Retried, because losing the race is normal rather than
      # exceptional: several agent-stacks commits landing close together
      # each raise a dispatch, and a run that spent three minutes
      # building can find main moved underneath it.
      #
      # Each attempt re-stages before pushing. Retrying the push alone
      # would fail identically every time — the commit is built on the
      # main that prepare checked out, so it is still not a
      # fast-forward. Rebasing the one staged commit onto the new main
      # is what makes the next attempt able to succeed.
      #
      # Still never a force: a rebase that conflicts, or five failed
      # attempts, leaves main untouched and the run red.
      - name: "Fast-forward main"
        env:
          # gh looks up the bot user id for the commit identity below.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # The app's bot user, so a landed commit names what pushed
          # it. The step above fails the job when no token was minted,
          # so the slug is always set here.
          slug="${{ steps.app-token.outputs.app-slug }}"
          git config user.name "${slug}[bot]"
          # The numeric form links the commit to the bot account. A
          # lookup that is refused leaves the plain form, which is
          # still a valid noreply address.
          id="$(gh api "/users/${slug}%5Bbot%5D" --jq .id 2>/dev/null || true)"
          git config user.email "${id:+$id+}${slug}[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:refs/heads/main"; then
              git push origin --delete "$STAGING_BRANCH"
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              break
            fi
            echo "push rejected, attempt $attempt of 5; re-staging onto main" >&2
            sleep 30
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "the staged commit conflicts with main; nothing was pushed." >&2
              echo "Run this workflow again for the same rev." >&2
              exit 1
            fi
            git push --force origin "HEAD:refs/heads/$STAGING_BRANCH"
          done
          echo "main moved under every attempt; nothing was pushed." >&2
          echo "Run this workflow again for the same rev." >&2
          exit 1

  # Reports a failed run as a Sentry event. This workflow is dispatched,
  # not scheduled, so there is no monitor and no start step: a silent
  # workflow is not a missed run. Every step is continue-on-error and
  # the token is read-only, so this job cannot change the run's
  # conclusion. The rev makes each failing release one issue.
  monitor:
    name: "Report the run to Sentry"
    needs: [prepare, verify, land]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        continue-on-error: true
        with:
          persist-credentials: false

      - name: "Report a failure to Sentry"
        continue-on-error: true
        uses: ./.github/actions/sentry-checkin
        with:
          dsn: ${{ secrets.MANAGED_PIPELINE_SENTRY_DSN }}
          monitor: agent-pkgs-update-agent-stacks
          results: ${{ toJSON(needs) }}
          fingerprint-extra: ${{ inputs.rev }}
