name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      NIX_CONFIG: |
        experimental-features = nix-command flakes
        # The flake offers cache.numtide.com as a substituter. Without
        # this, every nix command here opens with two warnings about
        # ignoring it, because the runner's user is not a trusted user.
        accept-flake-config = true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install flox
        uses: flox/install-flox-action@3b80351ae97bbe063f264dc88fbd505507054963 # v2.5.3

      - name: Configure nix
        uses: flox/configure-nix-action@28a4eb7f63bf54c91670b4a698f0a9ebfb95384f # main

      - name: Flake check (builds every package)
        run: nix flake check -L
