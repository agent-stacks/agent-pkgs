name: CI

# Evaluate everything; build the gates; build no package.
#
# `checks` is the gates — the non-package checks in flake.nix — so
# `nix flake check` builds those and nothing else. A package is Hydra's
# to build, from `packages.*` across every system, and building one
# here would repeat that work on a GitHub runner for every package on
# every push. The flake was checked that way until 2026-10-13, when
# `checks` still carried the packages: 315 of them, twice a push.
#
# Evaluation is not given up with it. `nix flake check` evaluates every
# output, packages included, so a bad default.nix, a missing attribute
# or a package that does not instantiate still fails here — which is
# most of what breaks in this repository.
#
# What this therefore does not prove: that a package still builds.
# Hydra proves that from `packages.*`.
#
# This is also the verification the replay and lock workflows run
# before they move main: each calls this workflow on its staging
# commit rather than keeping its own copy of the steps, so what a
# check means is decided here once. Until 2026-10-13 those two also
# built every plugin package for three systems; that gate is Hydra's
# now.
#
# update-agent-stacks is the exception and keeps its own matrix. It
# builds one package, `agent-stacks`, and runs the binary in an
# installCheck — a thing this workflow deliberately no longer does,
# since it builds no package at all.

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: >-
          The commit, branch or tag to check. Empty — which is what a
          push or a pull request passes, since neither sets an input —
          checks out what the event points at, as it did before this
          workflow was callable. A caller passes the SHA of its staged
          commit, so that what is checked is the commit about to land
          rather than the main the caller started from, or whatever its
          staging branch points at by the time this runs.
        type: string
        required: false
        default: ""

permissions:
  contents: read

env:
  NIX_CONFIG: |
    experimental-features = nix-command flakes
    # The flake offers cache.numtide.com as a substituter. Without
    # this, every nix command here opens with two warnings about
    # ignoring it, because the runner's user is not a trusted user.
    accept-flake-config = true

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      # One runner per system nix can build natively. The arm Linux
      # runner is here because it is the only thing that builds an
      # aarch64-linux derivation before Hydra sees it; it used to run
      # only in the update workflows, and they call this workflow now.
      # Linux arm runners are free on a public repository, which this
      # one is.
      #
      # Every runner is named by version, never by `-latest`: that
      # label moves (ubuntu-latest goes to Ubuntu 26 on 2026-10-19,
      # actions/runner-images#14748), and a label that changes the
      # image underneath a run changes it for every workflow at once,
      # on a day nobody chose. macos-26 is what macos-latest resolved
      # to on 2026-10-13. Moving any of them is then a commit someone
      # writes, with the runs that prove it attached.
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/nix-setup

      # Builds this runner's gates and evaluates this system's outputs.
      # Every runner, because a gate is built for the system it runs on.
      - name: Flake check (builds the gates)
        run: nix flake check -L

      # The systems no runner covers. `systems` in flake.nix is the
      # three above, so today every declared system is evaluated by
      # the step above on its own runner and this one finds nothing;
      # it is here so that declaring a fourth system does not silently
      # go unevaluated until Hydra. Evaluation is pure and does not
      # depend on the host, so one runner answers for all of them —
      # running it on each would be the same work three times.
      - name: Evaluate every system
        if: matrix.os == 'ubuntu-24.04'
        run: nix flake check -L --all-systems

  # Lints the workflows themselves. A job here rather than a flake
  # check on purpose: a flake check is a gate, so it would run in the
  # hourly verify of the update workflows, and a nixpkgs bump that
  # makes actionlint stricter would then block a refresh from landing.
  # Only a push or a pull request runs it; a workflow_call from an
  # update workflow reports its caller's event and skips it, which
  # Summary reads as passing.
  #
  # The tools come from the flake's pinned nixpkgs (`--inputs-from .`)
  # rather than whatever the runner image ships, so the lint changes
  # when flake.lock does.
  workflows-lint:
    name: Lint the workflows
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: ./.github/actions/nix-setup

      - name: Lint
        run: >-
          nix shell --inputs-from .
          nixpkgs#actionlint nixpkgs#shellcheck nixpkgs#yq-go
          -c .github/scripts/workflows-lint.sh

  # The one check branch protection requires. Every other job's name
  # carries a matrix value, so requiring them by name ties protection
  # to the matrix: change a runner and the required list goes stale
  # silently, either blocking forever on a check nobody runs or passing
  # because the new check was never required. This job's name never
  # changes.
  #
  # `if: always()` so it runs even when a dependency failed, was
  # cancelled, or was skipped. Without it the summary is skipped too,
  # and a skipped required check reads as success.
  summary:
    name: Summary
    needs: [check, workflows-lint]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      # `failure` and `cancelled` fail; `success` and `skipped` pass.
      - name: Check every job succeeded or was skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          if printf '%s' "$RESULTS" \
            | grep -q '"result": *"\(failure\|cancelled\)"'; then
            echo "at least one job did not succeed" >&2
            exit 1
          fi
