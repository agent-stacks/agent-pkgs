name: "Update agent plugins"

# Replays the import recorded in every package's source.json, so an
# upstream that moved is picked back up without anyone reconstructing the
# import by hand. `--replay` applies the flags the package records and
# refuses any other (agent-stacks ADR 0048), so the invocation here is the
# same one a hand replay types. Off the hour because runner queues are
# worst at :00.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: >-
          Replay, stage and verify, but leave main where it is. A
          dispatch from any other branch never moves main, ticked or
          not.
        type: boolean
        default: false

permissions:
  contents: write

# The workflow ends by moving main. Two runs doing that at once would leave
# one of them rejected halfway through, so they are queued. Never cancelled:
# a cancelled run can have already pushed the staging branch.
concurrency:
  group: update-agent-plugins
  cancel-in-progress: false

env:
  NIX_CONFIG: |
    experimental-features = nix-command flakes
    # The flake offers cache.numtide.com as a substituter. Without this,
    # every nix command here opens with two warnings about ignoring it,
    # because the runner's user is not a trusted user.
    accept-flake-config = true
  # Where prepare stages the commit for the verify jobs to build. It is not
  # a pull request branch; land fast-forwards main onto it and deletes it.
  STAGING_BRANCH: update-agent-plugins

jobs:
  # The distinct upstreams, and how they are divided between runners.
  #
  # A package is not the unit of a replay: one import writes every
  # package its upstream holds, so replaying per package imports a
  # marketplace once per package it produces and each run rewrites the
  # files the one before it wrote. 309 packages are 172 upstreams, so
  # 137 of the runs were redundant — `wshobson/agents` alone was
  # imported 50 times an hour, `intellectronica/agent-skills` 22
  # (AI-913).
  #
  # Needs no nix: it reads the recorded files and nothing else.
  gather:
    name: "Gather the upstreams to replay"
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: "Reduce the packages to their upstreams"
        id: plan
        run: |
          set -euo pipefail

          # One line per package, "<input>\t<flags, sorted>", so that
          # two packages naming one upstream with different recorded
          # flags show up as two lines for the same input. Nothing does
          # that today. If something starts to, --replay is what says
          # so, at the upstream it happens on, in the words it already
          # uses for it — this only names them here so the run summary
          # does not make it look like an unexplained import failure.
          jq -r '[.import.input, (.import.flags // [] | sort | join(" "))] | @tsv' \
            pkgs/agent-plugin-*/source.json | sort -u > all.tsv

          cut -f1 all.tsv | uniq -d > disagree.txt
          if [ -s disagree.txt ]; then
            {
              echo "### Upstreams recorded with more than one set of flags"
              echo
              sed 's/^/- /' disagree.txt
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          cut -f1 all.tsv | sort -u > inputs.txt
          count=$(wc -l < inputs.txt)
          echo "$count distinct upstreams"

          # Round-robin across at most SHARDS runners rather than one
          # job per upstream: 172 jobs would spend more time starting
          # runners and installing nix than importing, and the queue
          # is shared with every other workflow in the org. Empty
          # shards are dropped, so fewer upstreams than SHARDS does not
          # schedule empty jobs.
          #
          # Not weighted: one replay of every upstream on 2026-10-13
          # took a median 1.2s an import and 26s at the slowest, which
          # is no marketplace, so a shard's runtime is its runner and
          # nix setup whichever upstreams it is dealt.
          SHARDS=12
          jq -R . < inputs.txt | jq -sc --argjson n "$SHARDS" '
            [ range(0; $n) as $i
              | { shard: ($i + 1),
                  inputs: ( to_entries
                            | map(select(.key % $n == $i) | .value)
                            | join(" ") ) } ]
            | map(select(.inputs != ""))
            | { include: . }' > matrix.json

          echo "matrix=$(cat matrix.json)" >> "$GITHUB_OUTPUT"
          jq -r '.include[] | "shard \(.shard): \(.inputs | split(" ") | length) upstream(s)"' matrix.json

  # One import per upstream, in parallel. Each shard writes only the
  # packages its own upstreams produce, so the shards should touch
  # disjoint paths and a patch per shard recombine without conflict.
  #
  # fail-fast is off and an import that fails does not fail the job: a
  # dead upstream must not stop every other package from landing. The
  # failures travel in the artifact and the report job prints them
  # after the rest has landed. A job that does fail here failed at
  # something other than an import, and then stage does not run.
  replay:
    name: "Replay shard ${{ matrix.shard }}"
    needs: gather
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.gather.outputs.matrix) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: ./.github/actions/nix-setup

      - name: "Replay this shard's upstreams"
        env:
          INPUTS: ${{ matrix.inputs }}
        run: |
          set -uo pipefail
          mkdir -p out
          : > out/failed.txt
          read -ra inputs <<< "$INPUTS"
          # So prepare can name them if this shard's patch is refused.
          printf '%s\n' "${inputs[@]}" > out/inputs.txt
          for input in "${inputs[@]}"; do
            echo "::group::$input"
            if ! nix run .#agent-stacks -- import "$input" --replay --out pkgs; then
              echo "$input" >> out/failed.txt
            fi
            echo "::endgroup::"
          done

      # A patch rather than the files, so that a package this shard
      # deleted is carried over too, and so that two shards writing
      # the same path is refused in prepare instead of one silently
      # winning.
      - name: "Record what this shard wrote"
        run: |
          set -euo pipefail
          git add -A pkgs
          git diff --cached --binary HEAD -- pkgs > out/pkgs.patch
          wc -c < out/pkgs.patch | xargs echo "patch bytes:"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: replay-${{ matrix.shard }}
          path: out
          retention-days: 1

  prepare:
    name: "Collect the shards and stage one commit"
    needs: replay
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.stage.outputs.changed }}
      # The commit verify checks and land pushes, named exactly
      # rather than through the branch it also sits on.
      sha: ${{ steps.stage.outputs.sha }}
      failed: ${{ steps.import.outputs.failed }}
    steps:
      # The pushes below authenticate as a GitHub App, not as the
      # workflow's own GITHUB_TOKEN.
      #
      # main carries two rulesets. main-block refuses a deletion or a
      # non-fast-forward, which none of this does. main-require wants a
      # pull request and a passing Summary check, and a ruleset's bypass
      # list can name only roles, teams, deploy keys and installed apps
      # — the built-in GitHub Actions app is not one of them, so
      # GITHUB_TOKEN cannot be exempted and its push is refused with
      # "GH006: Protected branch update failed". The app is in that
      # bypass list, so the token minted here lands.
      #
      # The app is agent-stacks-updater, installed on the repositories
      # whose packages it updates, and its credentials are organization
      # secrets rather than this repository's, so one app and one key
      # serve all of them. A token is scoped to the repository it is
      # minted in; reaching another one would need owner/repositories
      # passed here as well.
      #
      # No fallback to GITHUB_TOKEN. There was one until 2026-10-13,
      # with continue-on-error here, so that the workflows kept
      # working before the app existed. What it did once the app was
      # the only way main moves: a private key stored with its
      # newlines collapsed failed this step, every job reported
      # success, and three runs built for an hour each before land was
      # refused with GH013 — the one symptom that does not name the
      # cause. The token is a precondition now, and a run without it
      # stops here saying so.
      - name: "Mint a token for the app that may push main"
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.MANAGED_AGENT_STACKS_UPDATER_APP_ID }}
          private-key: ${{ secrets.MANAGED_AGENT_STACKS_UPDATER_PRIVATE_KEY }}

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          token: ${{ steps.app-token.outputs.token }}

      # No nix here any more: this job applies patches and writes a
      # commit, and the shards are what run the importer.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: replay-*
          path: shards

      # One commit, not one per upstream: the staged commit is what
      # the verify jobs check and what land fast-forwards onto main.
      #
      # The shards should write disjoint paths, so the patches apply in
      # any order. Two can still collide: two upstreams claiming one
      # package name, as azure did before AI-757 settled it. --3way is
      # not passed, so that is never merged quietly, and git apply is
      # all or nothing, so a refused patch leaves the index as it was.
      # The shard whose patch is refused is left out, every upstream
      # in it reported as failed, and the rest still lands — a clash
      # between two upstreams is collected like a failed import, not
      # allowed to hold back the other 170.
      - name: "Apply what the shards wrote"
        id: import
        run: |
          set -euo pipefail
          failed="$(cat shards/replay-*/failed.txt 2>/dev/null | grep . || true)"
          for shard in shards/replay-*; do
            patch="$shard/pkgs.patch"
            [ -s "$patch" ] || continue
            if git apply --index "$patch"; then
              echo "applied $shard"
              continue
            fi
            echo "::error::$shard writes a path another shard already wrote; none of its upstreams are staged"
            refused="$(sed 's/$/ (not staged: its shard collided with another)/' "$shard/inputs.txt")"
            failed="$(printf '%s\n%s' "$failed" "$refused" | grep . || true)"
          done
          if [ -n "$failed" ]; then
            {
              echo "failed<<EOF"
              echo "$failed"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: "Stage the commit"
        id: stage
        env:
          # gh looks up the bot user id for the commit identity below.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          if git diff --cached --quiet -- pkgs; then
            echo "no packages changed"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The app's bot user, so a landed commit names what pushed
          # it. The step above fails the job when no token was minted,
          # so the slug is always set here.
          slug="${{ steps.app-token.outputs.app-slug }}"
          git config user.name "${slug}[bot]"
          # The numeric form links the commit to the bot account. A
          # lookup that is refused leaves the plain form, which is
          # still a valid noreply address.
          id="$(gh api "/users/${slug}%5Bbot%5D" --jq .id 2>/dev/null || true)"
          git config user.email "${id:+$id+}${slug}[bot]@users.noreply.github.com"
          git commit -q -m "chore(agent-plugins): replay recorded imports"
          git push --force origin "HEAD:refs/heads/$STAGING_BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # The same verification a pull request gets, on the staged commit:
  # the gates built on every runner, and every output evaluated for
  # every system. Called rather than copied so that a change to what a
  # check means is made in ci.yml alone.
  #
  # It built every plugin package for three systems until 2026-10-13.
  # That is Hydra's job: it builds `packages.*` for every system, and
  # repeating it here spent an hour of runner time per cycle to learn
  # the same thing later than Hydra does.
  verify:
    needs: prepare
    if: ${{ needs.prepare.outputs.changed == 'true' }}
    # The staged commit itself. `with` cannot read `env`, so the
    # branch name could only be repeated here as a literal to be kept
    # in sync by hand; `needs` it can read, and a commit cannot be
    # moved underneath the job the way a branch can.
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  land:
    name: "Move main onto the staged commit"
    needs: [prepare, verify]
    # Only from main. prepare stages on whatever ref was dispatched,
    # and the token below bypasses the pull request main requires, so
    # landing a dispatch from another branch would put that branch's
    # unreviewed commits on main. inputs.dry-run is unset on a
    # schedule, so only a dispatch that asks for it stops here.
    if: >-
      ${{ needs.prepare.outputs.changed == 'true'
      && github.ref == 'refs/heads/main'
      && !inputs.dry-run }}
    runs-on: ubuntu-24.04
    steps:
      # The pushes below authenticate as a GitHub App, not as the
      # workflow's own GITHUB_TOKEN.
      #
      # main carries two rulesets. main-block refuses a deletion or a
      # non-fast-forward, which none of this does. main-require wants a
      # pull request and a passing Summary check, and a ruleset's bypass
      # list can name only roles, teams, deploy keys and installed apps
      # — the built-in GitHub Actions app is not one of them, so
      # GITHUB_TOKEN cannot be exempted and its push is refused with
      # "GH006: Protected branch update failed". The app is in that
      # bypass list, so the token minted here lands.
      #
      # The app is agent-stacks-updater, installed on the repositories
      # whose packages it updates, and its credentials are organization
      # secrets rather than this repository's, so one app and one key
      # serve all of them. A token is scoped to the repository it is
      # minted in; reaching another one would need owner/repositories
      # passed here as well.
      #
      # No fallback to GITHUB_TOKEN. There was one until 2026-10-13,
      # with continue-on-error here, so that the workflows kept
      # working before the app existed. What it did once the app was
      # the only way main moves: a private key stored with its
      # newlines collapsed failed this step, every job reported
      # success, and three runs built for an hour each before land was
      # refused with GH013 — the one symptom that does not name the
      # cause. The token is a precondition now, and a run without it
      # stops here saying so.
      - name: "Mint a token for the app that may push main"
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.MANAGED_AGENT_STACKS_UPDATER_APP_ID }}
          private-key: ${{ secrets.MANAGED_AGENT_STACKS_UPDATER_PRIVATE_KEY }}

      # The commit verify checked, named by SHA rather than through
      # the staging branch, which can have moved since. If main has
      # moved too, the loop below rebases it, and what lands is the
      # verified change replayed onto the newer main rather than the
      # exact tree verify saw: a conflict stops it, nothing re-checks it.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0

      # A fast-forward, never a force: the staged commit was built on the main
      # that existed when prepare ran, and a push that is no longer a
      # fast-forward means main moved underneath it. Rerunning the dispatch
      # restages on the new main, which is the honest fix — forcing here would
      # discard whatever landed in between.
      # Retried, because losing the race is normal rather than
      # exceptional: several agent-plugin import commits landing close
      # together each raise a dispatch, and a run that spent three minutes
      # building can find main moved underneath it.
      #
      # Each attempt re-stages before pushing. Retrying the push alone
      # would fail identically every time — the commit is built on the
      # main that prepare checked out, so it is still not a
      # fast-forward. Rebasing the one staged commit onto the new main
      # is what makes the next attempt able to succeed.
      #
      # Still never a force: a rebase that conflicts, or five failed
      # attempts, leaves main untouched and the run red.
      - name: "Fast-forward main"
        env:
          # gh looks up the bot user id for the commit identity below.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # The app's bot user, so a landed commit names what pushed
          # it. The step above fails the job when no token was minted,
          # so the slug is always set here.
          slug="${{ steps.app-token.outputs.app-slug }}"
          git config user.name "${slug}[bot]"
          # The numeric form links the commit to the bot account. A
          # lookup that is refused leaves the plain form, which is
          # still a valid noreply address.
          id="$(gh api "/users/${slug}%5Bbot%5D" --jq .id 2>/dev/null || true)"
          git config user.email "${id:+$id+}${slug}[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:refs/heads/main"; then
              git push origin --delete "$STAGING_BRANCH"
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              break
            fi
            echo "push rejected, attempt $attempt of 5; re-staging onto main" >&2
            sleep 30
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "the staged commit conflicts with main; nothing was pushed." >&2
              echo "Run this workflow again." >&2
              exit 1
            fi
            git push --force origin "HEAD:refs/heads/$STAGING_BRANCH"
          done
          echo "main moved under every attempt; nothing was pushed." >&2
          echo "Run this workflow again." >&2
          exit 1

  report:
    name: "Report failed imports"
    needs: prepare
    if: ${{ always() && needs.prepare.outputs.failed != '' }}
    runs-on: ubuntu-24.04
    steps:
      - name: "List the imports that failed"
        env:
          FAILED: ${{ needs.prepare.outputs.failed }}
        run: |
          echo "The following imports failed to replay:" >&2
          echo "$FAILED" >&2
          exit 1
