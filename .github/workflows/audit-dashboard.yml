name: "Audit dashboard"

# Publishes the plugin audit dashboard to GitHub Pages: one page built
# by scripts/audit-dashboard.py from every pkgs/agent-plugin-*/audit.json
# on main, with each finding linked to its file and line upstream.
# Described in docs/reference/plugin-audit.md.
#
# Runs after every commit that changes an audit: audit-plugins.yml's
# record job pushes as the updater app, and a push made with an app's
# token starts workflows (GITHUB_TOKEN's would not). Also when the
# generator or this workflow changes, and by hand.
#
# Needs Pages set to deploy from GitHub Actions, in the repository's
# settings under Pages.
on:
  push:
    branches: [main]
    paths:
      - "pkgs/agent-plugin-*/audit.json"
      - "scripts/audit-dashboard.py"
      - "scripts/audit-dashboard.html"
      - ".github/workflows/audit-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time, and the one in flight is let finish: the
# next run, queued behind it, publishes the newer main anyway.
concurrency:
  group: audit-dashboard
  cancel-in-progress: false

jobs:
  build:
    name: "Build the page"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      # The runner's python3; the generator needs nothing beyond its
      # standard library.
      - name: "Build the page"
        run: |
          set -euo pipefail
          mkdir -p site
          python3 scripts/audit-dashboard.py pkgs scripts/audit-dashboard.html site/index.html \
            --rev "$GITHUB_SHA" --rev-date "$(git log -1 --format=%cI)"
          # Served as is, not through Jekyll.
          touch site/.nojekyll

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: "Deploy to GitHub Pages"
    needs: build
    runs-on: ubuntu-24.04
    # Only what deploy-pages needs: to write the Pages site, and an OIDC
    # token to prove this run to it.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
