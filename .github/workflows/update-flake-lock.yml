name: "Update flake.lock"

on:
  schedule:
    # Hourly, at :37. Off the hour because runner queues are worst at
    # :00, and off :17 so this does not race update-agent-plugins for
    # main every hour — both end by pushing to it.
    - cron: "37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# The workflow ends by moving main. Two runs doing that at once would leave
# one of them rejected halfway through, so they are queued. Never cancelled:
# a cancelled run can have already pushed the staging branch.
concurrency:
  group: update-flake-lock
  cancel-in-progress: false

env:
  NIX_CONFIG: |
    experimental-features = nix-command flakes
    # The flake offers cache.numtide.com as a substituter. Without this,
    # every nix command here opens with two warnings about ignoring it,
    # because the runner's user is not a trusted user.
    accept-flake-config = true
  # Where prepare stages the commit for the verify jobs to build. It is not
  # a pull request branch; land fast-forwards main onto it and deletes it.
  STAGING_BRANCH: update-flake-lock

jobs:
  prepare:
    name: "Update the inputs and stage the commit"
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.stage.outputs.changed }}
      # The commit verify checks and land pushes, named exactly
      # rather than through the branch it also sits on.
      sha: ${{ steps.stage.outputs.sha }}
    steps:
      # The same app land pushes main as, so the commit it writes
      # names the same author the commit that lands does. The other
      # two update workflows already mint it in prepare; this one
      # committed as github-actions[bot] until 2026-10-13, which left
      # flake.lock commits on main attributed to a different bot than
      # every other automated commit beside them.
      - name: "Mint a token for the app that writes the commit"
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.MANAGED_AGENT_STACKS_UPDATER_APP_ID }}
          private-key: ${{ secrets.MANAGED_AGENT_STACKS_UPDATER_PRIVATE_KEY }}

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          token: ${{ steps.app-token.outputs.token }}

      # The start of the run, for Sentry's missed-check-in alert. The
      # schedule repeats the cron above; keep them equal. Never allowed
      # to change how the run ends, here or in the monitor job.
      - name: "Report the start to Sentry"
        continue-on-error: true
        uses: ./.github/actions/sentry-checkin
        with:
          dsn: ${{ secrets.MANAGED_PIPELINE_SENTRY_DSN }}
          monitor: agent-pkgs-update-flake-lock
          schedule: "37 * * * *"

      - name: "Install flox"
        uses: flox/install-flox-action@3b80351ae97bbe063f264dc88fbd505507054963 # v2.5.3

      - name: "Configure nix"
        uses: flox/configure-nix-action@28a4eb7f63bf54c91670b4a698f0a9ebfb95384f # main

      - name: "Point nix at a CA bundle"
        uses: ./.github/actions/nix-ssl-cert-file

      - name: "Trust the runner's user"
        uses: ./.github/actions/trust-nix-user

      # Named, not every input. skillspector-src, pyproject-nix, uv2nix
      # and pyproject-build-systems shape the SkillSpector build the
      # plugin audit's score depends on, and nothing here builds
      # packages, so a bump of theirs would land unbuilt. They move only
      # through a reviewed pull request; SkillSpector itself by editing
      # its tag in flake.nix (ADR 0020). A new input that should float
      # hourly is added to this list.
      - name: "Update flake inputs"
        run: nix flake update nixpkgs llm-agents

      - name: "Stage the commit"
        id: stage
        env:
          # gh looks up the bot user id for the commit identity below.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- flake.lock; then
            echo "flake.lock unchanged, nothing to do"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The app's bot user, so the commit names what wrote it. The
          # token step fails the job when none was minted, so the slug
          # is always set here.
          slug="${{ steps.app-token.outputs.app-slug }}"
          git config user.name "${slug}[bot]"
          # The numeric form links the commit to the bot account. A
          # lookup that is refused leaves the plain form, which is
          # still a valid noreply address.
          id="$(gh api "/users/${slug}%5Bbot%5D" --jq .id 2>/dev/null || true)"
          git config user.email "${id:+$id+}${slug}[bot]@users.noreply.github.com"
          git commit -q -m "chore: update flake.lock" -- flake.lock
          git push --force origin "HEAD:refs/heads/$STAGING_BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # The same verification a pull request gets, on the staged commit:
  # the gates built on every runner, and every output evaluated for
  # every system. Called rather than copied so that a change to what a
  # check means is made in ci.yml alone.
  #
  # It built every plugin package for three systems until 2026-10-13.
  # That is Hydra's job: it builds `packages.*` for every system, and
  # repeating it here spent an hour of runner time per cycle to learn
  # the same thing later than Hydra does.
  verify:
    needs: prepare
    if: ${{ needs.prepare.outputs.changed == 'true' }}
    # The staged commit itself. `with` cannot read `env`, so the
    # branch name could only be repeated here as a literal to be kept
    # in sync by hand; `needs` it can read, and a commit cannot be
    # moved underneath the job the way a branch can.
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  land:
    name: "Move main onto the staged commit"
    needs: [prepare, verify]
    # Only from main. prepare stages on whatever ref was dispatched,
    # and the token below bypasses the pull request main requires, so
    # landing a dispatch from another branch would put that branch's
    # unreviewed commits on main.
    if: >-
      ${{ needs.prepare.outputs.changed == 'true'
      && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    steps:
      # The push below authenticates as a GitHub App, not as the
      # workflow's own GITHUB_TOKEN.
      #
      # main carries two rulesets. main-block refuses a deletion or a
      # non-fast-forward, which none of this does. main-require wants a
      # pull request and a passing Summary check, and a ruleset's bypass
      # list can name only roles, teams, deploy keys and installed apps
      # — the built-in GitHub Actions app is not one of them, so
      # GITHUB_TOKEN cannot be exempted and its push is refused. The
      # app is in that bypass list, so the token minted here lands.
      #
      # This workflow had no app token until 2026-10-13, while the
      # other two did, so its land job could not succeed at all: every
      # push to main was refused. It had not been noticed because the
      # scheduled runs were failing earlier, in verify.
      #
      # The app is agent-stacks-updater, installed on the repositories
      # whose packages it updates, and its credentials are organization
      # secrets rather than this repository's, so one app and one key
      # serve all of them.
      - name: "Mint a token for the app that may push main"
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.MANAGED_AGENT_STACKS_UPDATER_APP_ID }}
          private-key: ${{ secrets.MANAGED_AGENT_STACKS_UPDATER_PRIVATE_KEY }}

      # The commit verify checked, named by SHA rather than through
      # the staging branch, which can have moved since. If main has
      # moved too, the loop below rebases it, and what lands is the
      # verified change replayed onto the newer main rather than the
      # exact tree verify saw: a conflict stops it, nothing re-checks it.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0

      # Retried, because losing the race for main is normal rather than
      # exceptional: the other refresh workflows push to main too, and a run
      # that spent minutes building three systems can find main moved
      # underneath it.
      #
      # Each attempt re-stages before pushing. Retrying the push alone would
      # fail identically every time — the commit is built on the main that
      # prepare checked out, so it is still not a fast-forward. Rebasing the
      # one staged commit onto the new main is what makes the next attempt
      # able to succeed.
      #
      # Still never a force onto main: a rebase that conflicts, or five
      # failed attempts, leaves main untouched and the run red.
      # The rebase below writes a commit, so this job needs an identity
      # of its own: prepare's runs on a different runner and does not
      # reach here. Without it the first lost race ends in "empty ident
      # name", which the handler then reports as a conflict.
      - name: "Fast-forward main"
        env:
          # gh looks up the bot user id for the commit identity below.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # The app's bot user, so a landed commit names what pushed
          # it. The step above fails the job when no token was minted,
          # so the slug is always set here.
          slug="${{ steps.app-token.outputs.app-slug }}"
          git config user.name "${slug}[bot]"
          # The numeric form links the commit to the bot account. A
          # lookup that is refused leaves the plain form, which is
          # still a valid noreply address.
          id="$(gh api "/users/${slug}%5Bbot%5D" --jq .id 2>/dev/null || true)"
          git config user.email "${id:+$id+}${slug}[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:refs/heads/main"; then
              git push origin --delete "$STAGING_BRANCH"
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              break
            fi
            echo "push rejected, attempt $attempt of 5; re-staging onto main" >&2
            sleep 30
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "the staged commit conflicts with main; nothing was pushed." >&2
              echo "Run this workflow again." >&2
              exit 1
            fi
            git push --force origin "HEAD:refs/heads/$STAGING_BRANCH"
          done
          echo "main moved under every attempt; nothing was pushed." >&2
          echo "Run this workflow again." >&2
          exit 1

  # Reports how the run ended. Its own job, run on every outcome, so a
  # failed or cancelled upstream job is still reported. Every step is
  # continue-on-error and the token is read-only: this job must not be
  # able to change a run's conclusion.
  monitor:
    name: "Report the run to Sentry"
    needs: [prepare, verify, land]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        continue-on-error: true
        with:
          persist-credentials: false

      - name: "Close the Sentry check-in"
        continue-on-error: true
        uses: ./.github/actions/sentry-checkin
        with:
          dsn: ${{ secrets.MANAGED_PIPELINE_SENTRY_DSN }}
          monitor: agent-pkgs-update-flake-lock
          schedule: "37 * * * *"
          results: ${{ toJSON(needs) }}
