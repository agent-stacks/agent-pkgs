name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      NIX_CONFIG: |
        experimental-features = nix-command flakes
        # The flake offers cache.numtide.com as a substituter. Without
        # this, every nix command here opens with two warnings about
        # ignoring it, because the runner's user is not a trusted user.
        accept-flake-config = true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install flox
        uses: flox/install-flox-action@3b80351ae97bbe063f264dc88fbd505507054963 # v2.5.3

      - name: Configure nix
        uses: flox/configure-nix-action@28a4eb7f63bf54c91670b4a698f0a9ebfb95384f # main

      - name: Trust the runner's user
        uses: ./.github/actions/trust-nix-user

      # `builtins.fetchTarball` does not consult substituters. It computes
      # its store path, checks whether that path is already valid, and if
      # not it downloads from the URL — so `accept-flake-config` and a
      # trusted user do not help, and the cache this repository already
      # trusts is simply never asked.
      #
      # numtide/llm-agents.nix resolves a bun lockfile at evaluation time,
      # and one entry points at cdn.sheetjs.com because SheetJS is not on
      # the npm registry. macOS runners fail that host's TLS often enough
      # to take down `nix flake check` most of the day, which also stops
      # the hourly replay landing anything (AI-787).
      #
      # Pulling the path from cache.numtide.com first makes it valid
      # locally, so evaluation finds it and never reaches the CDN. The
      # path is pinned by flake.lock's llm-agents rev: bumping that input
      # may change it, in which case this becomes a no-op and the original
      # failure returns, visibly. It is deliberately not fatal, so a stale
      # path cannot turn a working build red on its own.
      - name: "Pre-warm the eval-time tarball fetch"
        continue-on-error: true
        run: |
          nix copy --from https://cache.numtide.com \
            /nix/store/mzx7n8ay30q7phfqs85vjy5j5cyk99cj-source \
            || echo "pre-warm missed; see AI-787 if the flake check now fails on cdn.sheetjs.com"

      - name: Flake check (builds every package)
        run: nix flake check -L
